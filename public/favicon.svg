<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A00"/>
      <stop offset="50%" style="stop-color:#FFD54A"/>
      <stop offset="100%" style="stop-color:#00E5FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050816"/>
      <stop offset="100%" style="stop-color:#1A233A"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bgGrad)" stroke="url(#boltGrad)" stroke-width="2"/>
  <!-- Outer glow ring -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
  <!-- Lightning Bolt "H" hybrid shape -->
  <path d="M55 18 L35 55 L48 55 L40 82 L72 40 L56 40 L65 18 Z" 
        fill="url(#boltGrad)"
        stroke="#FFD54A"
        stroke-width="0.5"
        opacity="0.95"/>
  <!-- Inner highlight -->
  <path d="M52 22 L38 52 L48 52 L42 74 L66 42 L54 42 L60 22 Z" 
        fill="white" 
        opacity="0.15"/>
  <!-- Corner sparkle dots -->
  <circle cx="22" cy="22" r="1.5" fill="#00E5FF" opacity="0.6"/>
  <circle cx="78" cy="25" r="1" fill="#FF8A00" opacity="0.5"/>
  <circle cx="75" cy="78" r="1.5" fill="#FFD54A" opacity="0.4"/>
  <circle cx="25" cy="75" r="1" fill="#00E5FF" opacity="0.5"/>
</svg>

